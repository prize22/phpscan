[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phpscan"
version = "0.4.0"
description = "PHP Security Research Engine - evidence-driven static analysis for PHP codebases"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "phpscan contributors" }]
keywords = ["php", "security", "sast", "taint-analysis", "webshell", "scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: PHP",
    "Operating System :: OS Independent",
]
dependencies = [
    "tree-sitter>=0.24",
    "tree-sitter-php>=0.22",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff==0.12.5"]

[project.scripts]
phpscan = "phpscan.cli:main"

[tool.setuptools.packages.find]
include = ["phpscan*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: marks tests that require a local HTTP server (integration/probing tests)",
]
