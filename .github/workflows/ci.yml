name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Benchmark corpus
        run: phpscan benchmark eval

  sarif:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Scan eval corpus (artifact smoke)
        run: |
          phpscan research eval --out-dir phpscan-out
      - uses: actions/upload-artifact@v4
        with:
          name: phpscan-sarif
          path: phpscan-out/phpscan.sarif
