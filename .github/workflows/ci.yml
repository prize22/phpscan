name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint with ruff
        run: python -m ruff check phpscan tests
      - name: Unit tests with coverage
        run: python -m pytest tests -q --cov=phpscan --cov-report=term
      - name: Benchmark corpus
        run: phpscan benchmark eval

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements-lock.txt --strict --progress-spinner off

  sarif:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Scan eval corpus (artifact smoke)
        run: |
          phpscan research eval --out-dir phpscan-out
      - uses: actions/upload-artifact@v4
        with:
          name: phpscan-sarif
          path: phpscan-out/phpscan.sarif
