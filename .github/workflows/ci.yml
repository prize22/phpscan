name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint with ruff
        run: python -m ruff check phpscan tests
      - name: Unit tests with coverage
        run: python -m pytest tests -q --cov=phpscan --cov-report=term
      - name: Benchmark corpus
        run: phpscan benchmark eval

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Type check
        run: python -m mypy phpscan

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements-lock.txt --strict --progress-spinner off

  locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Install phpscan without dependency resolution
        run: python -m pip install --no-deps -e .
      - name: Verify environment consistency
        run: python -m pip check
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Network tests
        run: python -m pytest tests -q -m network
      - name: Benchmark corpus
        run: phpscan benchmark eval
      - name: Verify installed version
        run: |
          python - <<'PY'
          import subprocess

          import phpscan

          out = subprocess.check_output(["phpscan", "--version"], text=True).strip()
          expected = "phpscan " + phpscan.__version__
          assert out == expected, (out, expected)
          print(out)
          PY

  sarif:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Scan eval corpus (artifact smoke)
        run: |
          phpscan research eval --out-dir phpscan-out
      - uses: actions/upload-artifact@v4
        with:
          name: phpscan-sarif
          path: phpscan-out/phpscan.sarif
